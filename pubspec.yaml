name: malibots_challenge_eni
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  font_awesome_flutter: ^10.12.0
  iconsax: ^0.0.8
  carousel_slider: ^5.1.1
  material_design_icons_flutter: ^7.0.7296
  audioplayers: ^6.5.1

  provider: ^6.1.5+1
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  uuid: ^4.2.1
  file_picker: ^10.3.3
  url_launcher: ^6.3.2
  http: ^1.6.0
  dio: ^5.9.0
  cached_network_image: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^2.0.7


flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_appli.png" 
flutter_native_splash:
  color: "#ffffff"  
  image: "assets/images/logo.jpg"  
  android: true
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6   # Assurez-vous d'avoir la dernière version
  hive_generator: ^2.0.1


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:

    - assets/images/
    - assets/images/produits/
    - assets/images/Acceuil/
    - assets/images/artistes/
    - assets/musics/bambara/
    - assets/musics/songhoy/
    - assets/musics/tamasheq/
    - assets/musics/dogon/
    - assets/musics/soninke/
    - assets/musics/senoufu/
    - assets/
    - assets/images/produits/
    - assets/galerie/

    


