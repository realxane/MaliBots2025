name: malibots_challenge_eni
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  font_awesome_flutter: ^10.12.0
  iconsax: ^0.0.8
  carousel_slider: ^5.1.1
  material_design_icons_flutter: ^7.0.7296
  audioplayers: ^6.5.1

  provider: ^6.1.5+1
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  uuid: ^4.2.1
  file_picker: ^10.3.3
